<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Practice</title>
    <link rel="stylesheet" href="01 Card.css">
</head>
<body>

    <!-- 🟢 Main Card Wrapper with Class -->
    <div class="card">
        <header>
            <div id="image-section">
                <img src="card image.jpg" alt="card-image">
            </div>
        </header>

        <main id="main-section">
            <div>
                <h2>Web Development Master <br>Course @Dot Batch</h2>
                <hr>
            </div>
        </main>

        <footer>
           <span id="span-disscounted-price"><strong>₹4500</strong></span>
           <span id="span-original-price"><del>₹6999</del></span>
           <span id="span-disscount-rate">42% off</span>
        </footer>
    </div>

</body>
</html>
