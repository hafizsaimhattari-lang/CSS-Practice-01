<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>01 valid Pseudo Class</title>
    <link rel="stylesheet" href="01 valid Pseudo Class.css">
</head>
<body>
    <form action="#">
        <label for="email"><b>Email:</b></label>
        <input type="email" id="email" required  title="Please enter a valid email address">

        <br><br>

        <label for="password"><b>Password:</b></label>
        <input type="password" id="password" required title="Please enter your password">

        <br><br>
        
        <label for="age"><b>Age:</b></label>
        <input type="number" id="age" min="0" max="70" title="Please enter a valid age">

        <br><br>
        
        <input type="submit" value="Submit">

    </form>
</body>
</html>
