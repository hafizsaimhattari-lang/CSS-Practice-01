<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>01 Disabled Pseudo-Class</title>
    <link rel="stylesheet" href="01 Disabled Pseudo-Class.css">
</head>
<body>
    <form> 
        <label for="Enabled-Input" id="Label-Enabled-Input">Enabled Input:</label>
        <input type="text" placeholder="Enabled Input" id="Enabled-Input">

        <br><br>

        <label for="Disabled-Input" id="Label-Disabled-Input">Disabled Input:</label>
        <input type="text" placeholder="Disabled Input" disabled id="Disabled-Input">

        <select>
            <option>Enabled Select</option>
            <option disabled>Disabled Select</option>
        </select>
        
        <br><br>

        <fieldset disabled>
            <legend>Disabled Fieldset</legend>
            <input type="text" placeholder="Disabled Input in Fieldset" disabled>    
        </fieldset>



    </form>
</body>
</html>
