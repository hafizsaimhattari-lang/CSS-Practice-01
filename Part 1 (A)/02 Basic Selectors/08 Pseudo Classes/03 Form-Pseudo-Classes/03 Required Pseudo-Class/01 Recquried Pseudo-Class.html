<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>01 Recquried Pseudo-Class</title>
    <link rel="stylesheet" href="01 Recquried Pseudo-Class.css">
</head>
<body>
    <form action="#" method="post">
        <label for="email">Email:</label>
        <input type="email" id="email" required  title="Please enter a valid email address">
        <br><br>
        <label for="password">Password:</label>
        <input type="password" id="password" required title="Please enter your password">
        <br><br>
        <input type="submit" value="Submit">
    </form>
</body>
</html>
