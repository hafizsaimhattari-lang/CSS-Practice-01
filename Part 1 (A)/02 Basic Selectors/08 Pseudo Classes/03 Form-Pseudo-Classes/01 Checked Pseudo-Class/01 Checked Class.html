<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>01 Checked Class Practice</title>
    <link rel="stylesheet" href="01Checked Class.css">
</head>
<body>
    
        <table>
            
                <tr id="table-tr1">
                    
                    <td>
                        <label for="Full-Name" style="color:white;"><strong>Enter Your Name : </strong> </label>
                    </td>

                    <td>
                        
                        <input type="text" Placeholder="Enter Full Name" id="Full-Name">
                    </td>
                
                </tr>
            

            
                <tr id="table-tr2" >
                    <td>
                        <label>Select Your Gender : </label>
                    </td>
                    <td>
                        

                        <input type="radio" name="gender" value="male" id="Male">
                        <label for="Male">Male</label>

                        <input type="radio" name="gender" value="female" id="Female">
                        <label for="Female">Female</label>
                    </td>
                </tr>
            
            


            
        </table>

        <div id="checksbox-div">
                <label>Select You Gender : </label>

                <p>
                <input type="checkbox" name="Checkbox-Gender" value="Checkbox-Gender-Male" id="Checkbox-Male">
                <label for="Checkbox-Male">Male</label>
                </p>  
                <input type="checkbox" name="Checkbox-Gender" value="Checkbox-Gender-Female" id="Checkbox-Female">
                <label for="Checkbox-Female">Female</label> 
        
        </div>

</body>
</html>
