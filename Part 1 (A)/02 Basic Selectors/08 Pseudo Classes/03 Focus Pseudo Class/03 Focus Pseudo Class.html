<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>03 Focus Pseudo Class</title>
    <link rel="stylesheet" href="03 Focus Pseudo Class.css">
</head>
<body>
    <div id="div-01">
        <section id="input-type-section">
            <table id="input-type-table">
                <tr>
                    
                    <td>
                        <label for="input" id="input-label"> Input :   
                        </label>
                    </td>
                    <td>
                         <input type="text" id="input" name="input">
                    </td>

                </tr>
            
            
            </table>
            
        </section>
        <hr>
        <section id="text-area-section">
            <textarea id="feedback" name="feedback" rows="10" cols="150"></textarea>
        </section>

        <section id="selective-area-section">
            
                <select id="selective-area">
                    <option value="enter-pakistan" selected>Pakistan</option>
                    <option value="enter-india">india</option>
                    <option value="enter-ban">Bangladesh</option>
                    <option value="enter-eng" selected>England</option>
                </select>
           
        </section>

        <section id="submit-button-section">
            <button id="submit-button">Submit</button>
        </section> 
        
    </div>
</body>
</html>
