<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>01 Placeholder Pseudo Element</title>
    <link rel="stylesheet" href="01 Placeholder Pseudo Element.css">
</head>
<body>
    <form>
        <label for="Name-Input">Name : </label>
        <input type="text" placeholder="Enter Your Name" id="Name-Input">
        <br><br>
        <label for="Email-Input">Email : </label>
        <input type="email" placeholder="Enter Your Email" id="Email-Input">
    </form>
</body>
</html>
